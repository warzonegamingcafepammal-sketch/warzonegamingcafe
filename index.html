<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARZONE GAMING CAFE</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --dark-bg: #050505;
            --card-bg: #121212;
            --neon-orange: #ff4d00;
            --neon-red: #ff1a1a;
            --light-silver: #e0e0e0;
            --glow-shadow: 0 0 20px rgba(255, 77, 0, 0.7);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        h1, h2, h3, h4, .offer-text {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- OFFER HEADER --- */
        .offer-header {
            background: linear-gradient(135deg, #ff1a1a, #ff4d00, #ff8c00);
            color: #fff;
            text-align: center;
            padding: 12px 15px;
            font-size: clamp(0.85rem, 2vw, 1.35rem);
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 6px 25px rgba(255, 77, 0, 0.7);
            position: sticky;
            top: 0;
            z-index: 1000;
            letter-spacing: 1px;
            border-bottom: 2px solid #fff;
            word-break: break-word;
        }

        .offer-header span.highlight {
            background: #000;
            color: #ff4d00;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #ff4d00;
        }

        .offer-header i {
            margin: 0 5px;
            animation: blink 0.8s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        /* --- NAVIGATION & HEADER --- */
        header {
            background-color: rgba(5, 5, 5, 0.95);
            border-bottom: 3px solid var(--neon-orange);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: relative;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            width: 70px; 
            height: 70px;
            border-radius: 12px;
            border: 3px solid var(--neon-orange);
            object-fit: cover;
            box-shadow: var(--glow-shadow);
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.3rem, 2.5vw, 2.2rem);
            font-weight: 900;
            color: #fff;
            line-height: 1.1;
            text-shadow: 0 0 15px var(--neon-orange);
        }

        .logo-text span {
            color: var(--neon-orange);
            display: block;
            font-size: clamp(0.9rem, 1.5vw, 1.4rem);
            letter-spacing: 3px;
        }

        /* Navigation Menu & Mobile Drawer */
        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 700;
            transition: var(--transition);
            text-transform: uppercase;
        }

        nav a:hover {
            color: var(--neon-orange);
            text-shadow: 0 0 8px var(--neon-orange);
        }

        .menu-toggle {
            display: none;
            background: transparent;
            border: 2px solid var(--neon-orange);
            color: #fff;
            font-size: 1.5rem;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: var(--glow-shadow);
            transition: var(--transition);
        }

        .menu-toggle:hover {
            background: var(--neon-orange);
        }

        /* --- HERO SECTION --- */
        .hero {
            padding: 70px 5% 40px 5%;
            text-align: center;
            position: relative;
            background: radial-gradient(circle, rgba(255, 77, 0, 0.15) 0%, rgba(5, 5, 5, 1) 75%);
        }

        .hero h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 25px rgba(255, 77, 0, 0.9);
        }

        .hero p {
            font-size: clamp(1.1rem, 2.5vw, 2rem);
            color: var(--neon-orange);
            font-weight: 800;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-glow {
            background: transparent;
            color: #fff;
            border: 2px solid var(--neon-orange);
            padding: 12px 25px;
            font-size: 1.05rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: var(--transition);
            box-shadow: var(--glow-shadow);
            text-decoration: none;
            display: inline-block;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-glow:hover:not(:disabled) {
            background: var(--neon-orange);
            box-shadow: 0 0 30px var(--neon-orange);
            transform: scale(1.03);
        }

        .btn-glow:disabled {
            border-color: #555;
            color: #777;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* --- AUTOMATIC CAROUSEL --- */
        .carousel-section {
            padding: 40px 0 20px 0;
            text-align: center;
            background: rgba(0,0,0,0.4);
            overflow: hidden;
            position: relative;
        }

        .section-title {
            font-size: clamp(1.5rem, 3.5vw, 2.5rem);
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
            padding: 0 15px;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 70px;
            height: 3px;
            background: var(--neon-orange);
            margin: 8px auto 0 auto;
            box-shadow: var(--glow-shadow);
        }

        .carousel-outer {
            width: 100%;
            overflow: hidden;
            margin: 0 auto;
            padding: 15px 0;
        }

        .carousel-track {
            display: flex;
            gap: 20px;
            width: max-content;
            transition: transform 0.1s linear;
        }

        .slide-card {
            background: var(--card-bg);
            border: 2px solid rgba(255, 77, 0, 0.2);
            border-radius: 10px;
            overflow: hidden;
            width: 200px;
            height: 300px;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            flex-shrink: 0;
        }

        .slide-card img {
            width: 100%;
            height: 78%;
            object-fit: cover;
            transition: var(--transition);
        }

        .slide-title {
            height: 22%;
            padding: 5px 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            font-weight: bold;
            color: #fff;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-top: 1px solid rgba(255, 77, 0, 0.2);
        }

        .slide-card:hover {
            border-color: var(--neon-orange);
            box-shadow: var(--glow-shadow);
            transform: translateY(-5px);
        }

        .slide-card:hover img {
            transform: scale(1.05);
        }

        /* --- DETAILED GAME DISPLAY MODAL --- */
        .game-detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .game-detail-container {
            background: #0d0d0d;
            border: 3px solid var(--neon-orange);
            border-radius: 12px;
            max-width: 1100px;
            width: 100%;
            height: 90vh;
            max-height: 700px;
            display: flex;
            box-shadow: var(--glow-shadow);
            overflow: hidden;
            position: relative;
            animation: modalScaleUp 0.3s ease;
        }

        @keyframes modalScaleUp {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .game-detail-image-panel {
            flex: 1;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 2px solid rgba(255, 77, 0, 0.3);
            overflow: hidden;
            min-height: 220px;
        }

        .game-detail-image-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-detail-text-panel {
            flex: 1.3;
            padding: 20px 25px;
            overflow-y: auto;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(180deg, #0d0d0d 0%, #050505 100%);
            -webkit-overflow-scrolling: touch;
        }

        .game-detail-title {
            font-size: clamp(1.3rem, 2.5vw, 2.2rem);
            color: #fff;
            text-shadow: 0 0 10px var(--neon-orange);
            border-bottom: 2px solid var(--neon-orange);
            padding-bottom: 8px;
            padding-right: 30px;
        }

        .game-detail-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .meta-badge {
            background: rgba(255, 77, 0, 0.15);
            border: 1px solid var(--neon-orange);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
        }

        .game-detail-body {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ddd;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-detail-body h4 {
            color: var(--neon-orange);
            font-size: 1.05rem;
            margin-top: 8px;
            border-left: 3px solid var(--neon-red);
            padding-left: 8px;
        }

        .game-detail-body ul {
            margin-left: 18px;
            list-style-type: square;
        }

        .game-detail-body li {
            margin-bottom: 4px;
        }

        .close-detail-modal {
            position: absolute;
            top: 10px;
            right: 12px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            z-index: 10;
            transition: var(--transition);
            background: rgba(0,0,0,0.6);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid var(--neon-orange);
        }

        .close-detail-modal:hover {
            color: var(--neon-red);
            background: #000;
        }

        /* --- BOOKING SECTION --- */
        .booking-section {
            background: linear-gradient(135deg, #0a0a0a 0%, #181818 100%);
            padding: 50px 5%;
            border-top: 3px solid var(--neon-orange);
        }

        .booking-container {
            max-width: 850px;
            margin: 0 auto;
            background-color: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--neon-orange);
            border-radius: 12px;
            padding: 25px 20px;
            box-shadow: var(--glow-shadow);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.95rem;
            margin-bottom: 5px;
            color: #bbb;
            text-transform: uppercase;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            background-color: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            font-size: 1rem;
            border-radius: 5px;
            outline: none;
            transition: var(--transition);
            font-family: 'Rajdhani', sans-serif;
            width: 100%;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--neon-orange);
            box-shadow: 0 0 10px rgba(255, 77, 0, 0.6);
        }

        .slot-warning {
            color: var(--neon-red);
            font-size: 0.85rem;
            margin-top: 4px;
            font-weight: bold;
            display: none;
        }

        .offer-indicator {
            color: #4caf50;
            font-size: 0.95rem;
            margin-top: 5px;
            font-weight: bold;
            display: none;
        }

        .price-display {
            background-color: rgba(255, 77, 0, 0.08);
            border: 2px dashed var(--neon-orange);
            padding: 18px 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .price-display h3 {
            font-size: clamp(1.3rem, 2.5vw, 2rem);
            color: #fff;
        }

        .price-display span {
            color: var(--neon-orange);
            font-weight: bold;
        }

        /* --- MODALS --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 2px solid var(--neon-orange);
            border-radius: 12px;
            max-width: 480px;
